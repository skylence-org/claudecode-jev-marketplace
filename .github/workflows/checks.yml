name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Every script here is POSIX sh or bash over curl + jq, and the suites are
  # stub-driven, so both platforms the plugins ship to run the same jobs. The
  # macOS leg exists for the BSD fallbacks (base64 -D, shasum, no GNU date %N).
  suites:
    name: shell suites (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # The checker follows the SHEBANG, not the extension.
      - name: shell syntax
        run: |
          for f in plugins/*/hooks/*.sh plugins/*/scripts/* plugins/*/statusline/*.sh plugins/*/skills/*/*.sh plugins/*/tests/*.sh plugins/*/tests/*/*.sh tools/*.sh .githooks/* herdr-plugins/*/test/*.sh herdr-plugins/org-relay/nudge-deliver herdr-plugins/org-relay/relay-ctl herdr-plugins/org-waker/waker herdr-plugins/aw-context/awctx; do
            [ -f "$f" ] || continue
            case "$(head -1 "$f")" in
              *bash*) bash -n "$f" || { echo "invalid bash: $f"; exit 1; } ;;
              *sh*)   sh -n "$f"   || { echo "invalid sh: $f"; exit 1; } ;;
            esac
          done

      - name: JSON syntax
        run: |
          shopt -s nullglob
          for f in .claude-plugin/marketplace.json plugins/*/hooks/*.json plugins/*/.claude-plugin/plugin.json plugins/*/scripts/*.json; do
            jq -e . "$f" >/dev/null || { echo "invalid JSON: $f"; exit 1; }
          done

      - name: parity (jev twins, wiring phrases)
        run: sh tools/check-parity.sh

      - name: core suite
        run: bash plugins/core/tests/jev.test.sh

      - name: herdr-agent-org gauge suite
        run: bash plugins/herdr-agent-org/tests/jev/gauge.test.sh

      - name: herdr-agent-org dispatch-worker suite (stubbed herdr)
        run: bash plugins/herdr-agent-org/tests/jev/dispatch.test.sh

      - name: conduct harness self-test (stubbed, no LLM call)
        run: sh plugins/herdr-agent-org/tests/conduct/run-conduct.sh --self-test

      # macOS only, matching upstream: the judge-hook suite leans on BSD/GNU
      # fallbacks (stat -f vs -c, base64 -D vs -d) and is only ever verified on
      # the platform it ships to. It stubs the claude CLI for the escalate paths.
      - name: judge-hook suite (unchanged from core-claude)
        if: matrix.os == 'macos-latest'
        run: bash plugins/core/hooks/judge-hook.test.sh

      # The suites drive the models through stubs and never export a key. If
      # that ever stops being true these jobs start costing money, which is
      # worth noticing.
      - name: assert the suites made no live model call
        run: |
          grep -q 'JEV_STUB_ANSWERS' plugins/core/tests/jev.test.sh || { echo "core suite no longer stubs Jev"; exit 1; }
          grep -q 'JEV_STUB_ANSWERS' plugins/herdr-agent-org/tests/jev/gauge.test.sh || { echo "gauge suite no longer stubs Jev"; exit 1; }
          grep -q 'unset TYPESAFE_API_KEY' plugins/core/tests/jev.test.sh || { echo "core suite does not clear the key"; exit 1; }
          grep -q 'stub_claude' plugins/core/hooks/judge-hook.test.sh || { echo "judge-hook suite no longer stubs the CLI"; exit 1; }

  # The org-relay daemon is the org's message bus and wake plane (L6); a red
  # crate here means the org ships deaf. Ubuntu is fine: rusqlite bundles
  # sqlite and rmcp is platform-neutral; the macOS-only pieces (launchd,
  # nudge-deliver) are shell, covered by the syntax job and the classify test.
  org-relay:
    name: org-relay build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo test
        run: cargo test --manifest-path herdr-plugins/org-relay/Cargo.toml
      - name: nudge-deliver classify suite
        run: sh herdr-plugins/org-relay/test/nudge_deliver_classify.sh
      - name: concurrency smoke (parallel awaits, fan-out, burst, consume race)
        run: |
          cargo build --manifest-path herdr-plugins/org-relay/Cargo.toml
          sh herdr-plugins/org-relay/test/concurrency_smoke.sh
      - name: org-waker suites
        run: for t in herdr-plugins/org-waker/test/*.sh; do sh "$t" || exit 1; done
      - name: aw-context smoke
        run: sh herdr-plugins/aw-context/test/smoke.sh

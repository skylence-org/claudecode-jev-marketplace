[package]
name = "org-relay"
version = "1.4.1"
edition = "2021"
description = "Durable MCP message bus for the herdr agent-org: SQLite queue + task-backed awaiting (SEP-2663) over rmcp streamable HTTP, guide-gated tools, plus a nudge watchdog that rings recipients whose backlog has no listener."

[workspace]

[dependencies]
rmcp = { version = "3.1", default-features = false, features = ["server", "transport-streamable-http-server"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tower-http = { version = "0.6", default-features = false, features = ["limit"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
strip = true

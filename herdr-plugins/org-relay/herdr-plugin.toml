id = "skylence.org-relay"
name = "Org Relay"
version = "1.3.1"
description = "Durable MCP message bus for the agent-org: SQLite queue + task-backed relay_await (MCP tasks / SEP-2663, harness auto-backgrounding for clients without it) over rmcp streamable HTTP, guide-gated messaging tools, nudge watchdog as last-resort net. Replaces composer-paste doorbells, waker rings, and the in-turn 50s re-arm loop."
min_herdr_version = "0.7.4"
platforms = ["macos", "linux"]

# Keep the relay resident: start it with the herdr session. relay-ctl start is
# idempotent (exits 0 if the port already answers /health).
[[startup]]
command = ["sh", "relay-ctl", "start"]

[[actions]]
id = "status"
title = "Org relay: queue status"
command = ["sh", "relay-ctl", "status"]

[[actions]]
id = "stop"
title = "Org relay: stop server"
command = ["sh", "relay-ctl", "stop"]
